<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>iPass · Prototipo del editor de entrada virtual (v2)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Barlow:wght@400;600;700&family=Bebas+Neue&family=Inter:wght@400;600;700;800&family=Montserrat:wght@400;600;700;800&family=Oswald:wght@400;600;700&family=Playfair+Display:wght@600;700;800&family=Poppins:wght@400;500;600;700;800&family=Space+Grotesk:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root{--bg:#0e1524;--panel:#141d30;--raised:#1b2740;--raised2:#24324f;--border:#2a3751;--ink:#f5f6f8;--muted:#9ba9c4;--dim:#7d89a3;--accent:#ad468d;--accent2:#c457a3;--yellow:#f5b700;--green:#35c48f;--red:#ff6b81}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:Poppins,system-ui,sans-serif;background:var(--bg);color:var(--ink);height:100dvh;overflow:hidden;font-size:13px}
  button,input,select,textarea{font:inherit;color:inherit}
  button{cursor:pointer;border:0;background:none}
  .app{display:grid;grid-template-rows:auto auto 1fr;height:100dvh}
  .top{display:flex;align-items:center;gap:10px;padding:10px 14px;background:var(--panel);border-bottom:1px solid var(--border);flex-wrap:wrap}
  .brand{font-weight:800;font-size:18px;margin-right:6px}.brand b{color:var(--accent)}
  .crumb{color:var(--muted);font-size:12px}.sp{flex:1}
  .btn{padding:8px 14px;border-radius:10px;background:var(--raised2);font-weight:600;font-size:12.5px;white-space:nowrap}
  .btn:hover{background:#2c3d60}.btn.pri{background:var(--accent)}.btn.pri:hover{background:var(--accent2)}
  .btn.sm{padding:5px 10px;font-size:12px}.btn[disabled]{opacity:.35;pointer-events:none}
  .ico{width:34px;height:34px;border-radius:10px;background:var(--raised2);font-size:15px}.ico[disabled]{opacity:.35;pointer-events:none}
  .scope{display:flex;align-items:center;gap:8px;padding:8px 14px;background:#101a2d;border-bottom:1px solid var(--border);flex-wrap:wrap}
  .scope label{color:var(--muted);font-size:12px;margin-right:2px}
  .pill{padding:6px 12px;border-radius:999px;background:var(--raised);border:1px solid var(--border);font-size:12px;font-weight:600;color:var(--muted)}
  .pill.on{background:var(--accent);border-color:var(--accent);color:#fff}
  .pill i{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--yellow);margin-left:6px}
  .scope .note{margin-left:auto;color:var(--dim);font-size:12px}
  .main{display:grid;grid-template-columns:250px 1fr 330px;min-height:0}
  aside{background:var(--panel);overflow:auto;min-height:0}
  .left{border-right:1px solid var(--border)}.right{border-left:1px solid var(--border)}
  h4{font-size:11px;text-transform:uppercase;letter-spacing:.8px;color:var(--dim);margin:16px 14px 8px}
  .add{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:0 14px}
  .add button{padding:10px 8px;border-radius:10px;background:var(--raised);border:1px solid var(--border);font-size:12px;font-weight:600}
  .add button:hover{border-color:var(--accent)}
  .layers{padding:0 8px 14px}
  .layer{display:flex;align-items:center;gap:8px;padding:7px 8px;border-radius:8px;font-size:12.5px;cursor:pointer;border:1px solid transparent}
  .layer:hover{background:var(--raised)}.layer.sel{background:var(--raised2);border-color:var(--accent)}
  .layer .t{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.layer .k{color:var(--dim);font-size:11px;width:38px;flex:none}
  .layer button{font-size:13px;opacity:.7}.layer button:hover{opacity:1}.layer.hid .t{opacity:.4;text-decoration:line-through}
  .stage{display:flex;flex-direction:column;min-width:0;min-height:0;background:radial-gradient(circle at 50% 30%,#18233a,#0b1220)}
  .tabs{display:flex;gap:6px;padding:10px 14px 4px;justify-content:center;flex-wrap:wrap;align-items:center}
  .tools{display:flex;gap:6px;padding:2px 14px 8px;justify-content:center;flex-wrap:wrap;align-items:center;font-size:12px;color:var(--muted)}
  .tools label{display:flex;gap:5px;align-items:center;cursor:pointer;padding:3px 8px;border-radius:8px;background:var(--raised)}
  .tools input{accent-color:var(--accent)}
  select{background:var(--raised);border:1px solid var(--border);border-radius:8px;padding:5px 8px;font-size:12px}
  select option{background:#1b2740}
  .view{flex:1;min-height:0;overflow:auto;display:flex;align-items:flex-start;justify-content:center;padding:6px 14px 18px}
  .phone{background:#06090f;border-radius:34px;padding:12px 10px;box-shadow:0 20px 60px rgba(0,0,0,.6);border:1px solid #2a3751;position:relative}
  .phone::before{content:"";display:block;width:60px;height:5px;border-radius:3px;background:#1c2536;margin:0 auto 8px}
  .canvaswrap{position:relative}
  .ticket{position:absolute;left:0;top:0;transform-origin:0 0;overflow:hidden;user-select:none}
  .ticket .el{position:absolute;overflow:hidden;line-height:1.15}
  .ticket .el.flex{display:flex;align-items:center}
  .overlay{position:absolute;left:0;top:0;transform-origin:0 0}
  .hit{position:absolute;cursor:move}.hit:hover{outline:1px dashed rgba(255,255,255,.55)}.hit.sel{outline:2px solid #4da3ff}.hit.lockd{cursor:default}
  .hnd{position:absolute;width:12px;height:12px;background:#fff;border:2px solid #4da3ff;border-radius:3px;z-index:5}
  .guide{position:absolute;background:#ff4d9a;z-index:6;pointer-events:none}
  .gridov{position:absolute;inset:0;pointer-events:none;background-image:linear-gradient(rgba(255,255,255,.08) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.08) 1px,transparent 1px);background-size:20px 20px}
  .safeov{position:absolute;inset:16px;border:1px dashed rgba(255,214,0,.55);pointer-events:none;border-radius:6px}
  .checks{width:100%;max-width:440px;margin:12px auto 0;display:grid;gap:6px}
  .chk{font-size:12px;display:flex;gap:8px;padding:7px 10px;border-radius:10px;background:var(--raised)}
  .chk.ok b{color:var(--green)}.chk.warn b{color:var(--yellow)}.chk.bad b{color:var(--red)}
  .grid3{display:flex;gap:18px;flex-wrap:wrap;justify-content:center;padding:6px 0}
  .card3{display:flex;flex-direction:column;align-items:center;gap:8px;font-size:12px;color:var(--muted)}
  .card3 .tagx{padding:3px 10px;border-radius:999px;background:var(--raised2);font-weight:600;color:var(--ink)}.card3 .tagx.o{background:rgba(245,183,0,.18);color:var(--yellow)}
  .mail{width:min(520px,100%);background:#f5f6f8;color:#192438;border-radius:14px;overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,.5);font-family:Arial,sans-serif}
  .mail .mh{background:#192438;color:#fff;padding:14px 24px;font-size:22px;font-weight:700}.mail .mh b{color:#ad468d}
  .mail .mb{padding:20px 24px;background:#fff}
  .mail .hero{position:relative;overflow:hidden;border-radius:12px;margin:12px 0}
  .mail .qrbox{text-align:center;border:1px solid #e6eaf0;border-radius:12px;padding:14px;margin:12px 0}.mail .qrbox svg{width:150px;height:150px}
  .mail p{font-size:13px;line-height:1.5;color:#60718b;margin-top:8px}
  .mail .mbtn{display:inline-block;background:#ad468d;color:#fff;padding:12px 22px;border-radius:10px;font-weight:700;margin-top:8px}
  .jsonwrap{width:min(780px,100%)}
  textarea.json{width:100%;height:380px;background:#0a101c;border:1px solid var(--border);border-radius:12px;padding:14px;font-size:11.5px;line-height:1.45;color:#cbd4e6;font-family:Consolas,monospace;resize:vertical}
  .ptabs{display:flex;border-bottom:1px solid var(--border);position:sticky;top:0;background:var(--panel);z-index:2}
  .ptabs button{flex:1;padding:12px 6px;font-weight:600;font-size:12.5px;color:var(--muted);border-bottom:2px solid transparent}
  .ptabs button.on{color:var(--ink);border-color:var(--accent)}
  .sec{padding:12px 14px;border-bottom:1px solid var(--border)}
  .sec>.st{font-weight:700;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center}
  .row{display:flex;align-items:center;gap:8px;margin-bottom:9px}
  .row label{width:84px;color:var(--muted);font-size:12px;flex:none}
  .row input[type=text],.row input[type=number],.row select{flex:1;min-width:0;background:var(--raised);border:1px solid var(--border);border-radius:8px;padding:6px 8px;font-size:12.5px}
  .row input[type=range]{flex:1;accent-color:var(--accent)}
  .row input[type=checkbox]{accent-color:var(--accent);width:16px;height:16px}
  .row input[type=color]{width:34px;height:28px;border:1px solid var(--border);border-radius:6px;background:none;padding:0;cursor:pointer}
  .row output{width:38px;text-align:right;color:var(--muted);font-size:12px}
  .seg{display:flex;background:var(--raised);border-radius:8px;padding:2px;flex:1;gap:2px}
  .seg button{flex:1;padding:5px 4px;border-radius:6px;font-size:12px;color:var(--muted)}.seg button.on{background:var(--accent);color:#fff}
  .sw{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
  .sw button{width:24px;height:24px;border-radius:7px;border:2px solid var(--border)}.sw button.on{border-color:#fff}
  .themes{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .theme{border-radius:10px;border:2px solid var(--border);padding:8px;text-align:left;background:var(--raised);font-size:12px;font-weight:600}.theme.on{border-color:var(--accent)}
  .theme .bars{display:flex;height:14px;border-radius:5px;overflow:hidden;margin-bottom:6px}.theme .bars i{flex:1}
  .shapes{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:12px}
  .shp{border-radius:10px;border:2px solid var(--border);padding:8px 4px 6px;background:var(--raised);font-size:11px;font-weight:600;text-align:center;color:var(--muted)}
  .shp.on{border-color:var(--accent);color:#fff}
  .shp svg{display:block;margin:0 auto 5px}
  .empty{padding:30px 18px;color:var(--dim);text-align:center;line-height:1.6}
  .hint{font-size:11.5px;color:var(--dim);line-height:1.5;margin-top:4px}
  .banner{margin:12px 14px 0;padding:10px 12px;border-radius:10px;background:rgba(245,183,0,.12);border:1px solid rgba(245,183,0,.35);color:#f6d778;font-size:12px;line-height:1.5}.banner .btn{margin-top:8px}
  .toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:#0b1220;border:1px solid var(--border);padding:11px 18px;border-radius:12px;z-index:60;font-weight:600;box-shadow:0 10px 40px rgba(0,0,0,.5);display:none}
  .modal{position:fixed;inset:0;background:rgba(5,8,14,.7);backdrop-filter:blur(5px);z-index:50;display:none;align-items:center;justify-content:center;padding:20px}.modal.open{display:flex}
  .box{background:var(--panel);border:1px solid var(--border);border-radius:16px;padding:20px;width:min(460px,100%);max-height:80vh;overflow:auto}.box h3{font-size:16px;margin-bottom:12px}
  .ver{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px solid var(--border);font-size:12.5px}
  @keyframes drain{from{width:100%}to{width:0}}
  @media(max-width:1000px){.main{grid-template-columns:1fr}aside{max-height:260px}.left{border-right:0;border-bottom:1px solid var(--border)}.right{border-left:0;border-top:1px solid var(--border)}body{overflow:auto}.app{height:auto}}
</style>
</head>
<body>
<div class="app">
  <div class="top">
    <div class="brand"><b>i</b>Pass</div>
    <div class="crumb">Eventos › <strong>Noche en vivo</strong> › Tipos de entrada › <strong>Diseñar entrada</strong></div>
    <div class="sp"></div>
    <button class="ico" id="undo" title="Deshacer (Ctrl+Z)">↶</button>
    <button class="ico" id="redo" title="Rehacer (Ctrl+Y)">↷</button>
    <button class="btn" id="hist">Historial</button>
    <button class="btn" id="reset">Restablecer</button>
    <button class="btn" id="test">Probar lectura del código</button>
    <button class="btn pri" id="publish">Publicar</button>
  </div>
  <div class="scope" id="scope"></div>
  <div class="main">
    <aside class="left">
      <h4>Agregar</h4>
      <div class="add">
        <button data-add="text">＋ Texto</button>
        <button data-add="field">＋ Dato del evento</button>
        <button data-add="shape">＋ Forma</button>
        <button data-add="circle">＋ Círculo</button>
        <button data-add="dash">＋ Línea de corte</button>
        <button data-add="image">＋ Imagen</button>
      </div>
      <input type="file" id="file" accept="image/*" hidden>
      <h4>Capas (de arriba a abajo)</h4>
      <div class="layers" id="layers"></div>
    </aside>
    <section class="stage">
      <div class="tabs" id="tabs"></div>
      <div class="tools" id="tools"></div>
      <div class="view" id="view"></div>
    </section>
    <aside class="right">
      <div class="ptabs"><button data-pt="design" class="on">Entrada</button><button data-pt="el">Elemento</button></div>
      <div id="props"></div>
    </aside>
  </div>
</div>
<div class="toast" id="toast"></div>
<div class="modal" id="modal"><div class="box" id="box"></div></div>

<script>
/* ═════════ Datos de ejemplo ═════════ */
const SESSIONS=[
  {id:'s1',label:'Vie 20 nov',date:'Viernes 20 de noviembre · 20:00',venue:'Alice Park'},
  {id:'s2',label:'Sáb 21 nov',date:'Sábado 21 de noviembre · 20:00',venue:'Alice Park'},
  {id:'s3',label:'Vie 27 nov',date:'Viernes 27 de noviembre · 21:00',venue:'Alice Park'}];
const TYPES=[
  {id:'gen',name:'General',price:'Bs 150',entry:'Acceso norte'},
  {id:'ter',name:'Terraza',price:'Bs 250',entry:'Acceso terraza'},
  {id:'vip',name:'Zona VIP',price:'Bs 450',entry:'Acceso VIP'}];
const DATA={event:{title:'Noche en vivo'},org:{name:'Alice Park'},buyer:{name:'María Fernández'},ticket:{code:'K7Q 3MX PA2'}};
const LONG={'event.title':'Gran Festival Internacional de Música Andina y Fusión 2026','buyer.name':'María del Carmen Fernández de la Vega','session.venue':'Centro de Convenciones Alice Park, Av. Melchor Urquidi'};
const FIELDS={'event.title':'Nombre del evento','session.date':'Fecha y hora','session.venue':'Lugar','type.name':'Tipo de entrada','type.price':'Precio','type.entry':'Acceso','buyer.name':'Nombre del comprador','ticket.code':'Código','org.name':'Organizador'};
const FONTS=['Poppins','Inter','Montserrat','Space Grotesk','Playfair Display','Oswald','Anton','Bebas Neue','Barlow'];
const THEMES={
  ipass:{name:'iPass',primary:'#ad468d',secondary:'#f5b700',text:'#ffffff',ink:'#192438',bg1:'#2a1840',bg2:'#111a2b'},
  noche:{name:'Noche',primary:'#7c5cff',secondary:'#ff6bd6',text:'#ffffff',ink:'#1a1233',bg1:'#2b1b66',bg2:'#0b0720'},
  rojo:{name:'Club rojo',primary:'#e8431f',secondary:'#ffd166',text:'#ffffff',ink:'#2a0a05',bg1:'#8a1220',bg2:'#1c0508'},
  verde:{name:'Festival verde',primary:'#25b77a',secondary:'#f5f26b',text:'#ffffff',ink:'#05261b',bg1:'#0e6b4a',bg2:'#04160f'},
  dorado:{name:'VIP dorado',primary:'#d4a73a',secondary:'#ffffff',text:'#fff6dc',ink:'#241a05',bg1:'#4a3a10',bg2:'#0e0b03'},
  claro:{name:'Claro',primary:'#ad468d',secondary:'#192438',text:'#192438',ink:'#192438',bg1:'#f5f6f8',bg2:'#e6eaf0'}};
const SIZES={short:{w:360,h:520,l:'Compacta'},std:{w:360,h:620,l:'Estándar'},tall:{w:360,h:720,l:'Alta'}};
const CODE_MIN={qr:[150,150],bar:[220,70],both:[170,230],nfc:[90,90]};
const CODE_LABEL={qr:'Código QR',bar:'Código de barras',both:'QR + barras',nfc:'NFC'};
const dim=d=>SIZES[d.size||'std'];

/* ═════════ Estado ═════════ */
let uid=1;const nid=()=>'e'+(uid++);
const clone=o=>JSON.parse(JSON.stringify(o));
function defaultDesign(themeKey='ipass'){
  const t=THEMES[themeKey];
  return {size:'std',theme:{key:themeKey,primary:t.primary,secondary:t.secondary,text:t.text,ink:t.ink},
    bg:{type:'gradient',c1:t.bg1,c2:t.bg2,angle:160,image:null,overlay:.45,blur:0,pattern:'none',patOp:.12},
    shape:{kind:'round',r:26,nr:16,ny:540,c:24,sc:22,bw:0,bc:'@secondary',stub:false,stubC:'@secondary'},
    els:[
    {id:nid(),kind:'text',name:'Logo',text:'iPass',x:24,y:22,w:110,h:32,size:24,weight:800,font:'Poppins',color:'@text',align:'left'},
    {id:nid(),kind:'field',name:'Tipo de entrada',field:'type.name',x:24,y:66,w:150,h:26,size:12,weight:700,font:'Poppins',color:'@ink',fill:'@secondary',radius:13,upper:true,align:'center',pad:12},
    {id:nid(),kind:'field',name:'Nombre del evento',field:'event.title',x:24,y:104,w:312,h:82,size:36,weight:800,font:'Poppins',color:'@text',align:'left'},
    {id:nid(),kind:'field',name:'Fecha y hora',field:'session.date',x:24,y:190,w:312,h:22,size:13.5,weight:600,font:'Poppins',color:'@text',align:'left'},
    {id:nid(),kind:'field',name:'Lugar',field:'session.venue',x:24,y:213,w:312,h:22,size:13.5,weight:400,font:'Poppins',color:'@text',align:'left',opacity:.85},
    {id:nid(),kind:'shape',sh:'rect',name:'Tarjeta del código',x:24,y:252,w:312,h:282,fill:'#ffffff',radius:22},
    {id:nid(),kind:'code',mode:'qr',name:'Código de acceso',prot:true,x:80,y:268,w:200,h:200,radius:12,ring:false,showText:true},
    {id:nid(),kind:'field',name:'Código',field:'ticket.code',x:40,y:480,w:280,h:24,size:15,weight:700,font:'Barlow',color:'@ink',align:'center',mono:true},
    {id:nid(),kind:'field',name:'Acceso',field:'type.entry',x:40,y:504,w:280,h:22,size:12,weight:600,font:'Poppins',color:'@primary',align:'center'},
    {id:nid(),kind:'text',name:'A nombre de',text:'A nombre de',x:24,y:550,w:312,h:16,size:10.5,weight:600,font:'Poppins',color:'@text',align:'left',opacity:.7,upper:true},
    {id:nid(),kind:'field',name:'Comprador',field:'buyer.name',x:24,y:566,w:312,h:24,size:17,weight:700,font:'Poppins',color:'@text',align:'left'},
    {id:nid(),kind:'text',name:'Aviso',text:'Lleva tu carnet. Este código es personal.',x:24,y:594,w:312,h:18,size:10.5,weight:400,font:'Poppins',color:'@text',align:'left',opacity:.65}
  ]};
}
const KEY='ipass-editor-proto-v2';
function fresh(){return {designs:{event:defaultDesign('ipass'),types:{gen:null,ter:null,vip:null}},scope:'event',sel:null,pt:'design',view:'phone',session:'s1',type:'gen',versions:[],grid:false,snap:false,safe:false,long:false,zoom:'fit'}}
let S;try{const raw=localStorage.getItem(KEY);S=raw?JSON.parse(raw):fresh();uid=2000+Math.floor(Math.random()*1e5)}catch(e){S=fresh()}
let past=[],future=[],guides=[];
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const persist=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
const snapshot=()=>{past.push(JSON.stringify(S.designs));if(past.length>80)past.shift();future=[]};
const commit=(re=true)=>{persist();if(re)renderAll()};
function toast(m){const t=$('#toast');t.textContent=m;t.style.display='block';clearTimeout(toast.h);toast.h=setTimeout(()=>t.style.display='none',2400)}
const editing=()=>S.scope==='event'?S.designs.event:S.designs.types[S.scope];
const effective=tid=>S.designs.types[tid]||S.designs.event;
const shownDesign=()=>S.scope==='event'?S.designs.event:(S.designs.types[S.scope]||S.designs.event);
const selEl=()=>{const d=editing();return d&&d.els.find(e=>e.id===S.sel)};

/* ═════════ Dibujo ═════════ */
const color=(c,th)=>!c?'transparent':c[0]==='@'?th[c.slice(1)]:c;
function fieldVal(f,sid,tid){
  if(S.long&&LONG[f])return LONG[f];
  const s=SESSIONS.find(x=>x.id===sid),t=TYPES.find(x=>x.id===tid);
  return ({'event.title':DATA.event.title,'session.date':s.date,'session.venue':s.venue,'type.name':t.name,'type.price':t.price,'type.entry':t.entry,'buyer.name':DATA.buyer.name,'ticket.code':DATA.ticket.code,'org.name':DATA.org.name})[f]||'';
}
function rng(seed){let h=0;for(const c of seed)h=(h*31+c.charCodeAt(0))>>>0;return()=>{h^=h<<13;h>>>=0;h^=h>>17;h^=h<<5;h>>>=0;return h/4294967296}}
function qrSVG(seed){
  const N=29,rnd=rng(seed),m=[...Array(N)].map(()=>[...Array(N)].map(()=>rnd()>.52));
  const finder=(r,c)=>{for(let i=-1;i<8;i++)for(let j=-1;j<8;j++){const y=r+i,x=c+j;if(y<0||x<0||y>=N||x>=N)continue;m[y][x]=(i>=0&&i<=6&&(j===0||j===6))||(j>=0&&j<=6&&(i===0||i===6))||(i>=2&&i<=4&&j>=2&&j<=4)}};

const lum=hex=>{const m=hex.replace('#','').match(/.{2}/g).map(h=>parseInt(h,16)/255).map(v=>v<=.03928?v/12.92:Math.pow((v+.055)/1.055,2.4));return .2126*m[0]+.7152*m[1]+.0722*m[2]};

function review(d){
  const out=[],{w:W,h:H}=dim(d),c=d.els.find(e=>e.kind==='code');
  if(!c||c.visible===false)out.push(['bad','Falta el código de acceso o está oculto.']);
  else{
    const mode=c.mode||'qr',[mw,mh]=CODE_MIN[mode];
    if(mode==='nfc')out.push(['warn','Solo NFC: el comprador necesita una pulsera o tarjeta. No hay código que leer con cámara.']);
    else if(c.w<mw||c.h<mh)out.push(['bad',`${CODE_LABEL[mode]}: mide ${Math.round(c.w)}×${Math.round(c.h)} px y el mínimo es ${mw}×${mh}.`]);
    else out.push(['ok',`${CODE_LABEL[mode]} de ${Math.round(c.w)}×${Math.round(c.h)} px (mínimo ${mw}×${mh}).`]);
    const over=d.els.filter(e=>e.id!==c.id&&e.visible!==false&&e.kind!=='shape'&&!(e.x>=c.x+c.w||e.x+e.w<=c.x||e.y>=c.y+c.h||e.y+e.h<=c.y));
    out.push(over.length?['bad',`"${over[0].name}" tapa el código. Muévelo.`]:['ok','Nada tapa el código.']);
    if(c.x<0||c.y<0||c.x+c.w>W||c.y+c.h>H)out.push(['bad','El código se sale de la entrada.']);
    const sp=d.shape||{};if(sp.kind==='notch'||sp.kind==='stub'){const nr=sp.nr||14,ny=sp.ny||H*.8;if(c.y<ny+nr&&c.y+c.h>ny-nr&&(c.x<nr||c.x+c.w>W-nr))out.push(['warn','Una muesca del borde está muy cerca del código.'])}
    if(mode!=='nfc')out.push(['ok','Lleva marco blanco propio: se lee sobre cualquier fondo.']);
  }
  const bgc=d.bg.type==='image'?'#555555':d.bg.type==='gradient'?mix(d.bg.c1,d.bg.c2):d.bg.c1;
  const low=d.els.filter(e=>e.visible!==false&&(e.kind==='text'||e.kind==='field')).filter(e=>{
    const fg=color(e.color,d.theme),under=d.els.some(s=>s.kind==='shape'&&s.sh!=='dash'&&s.visible!==false&&e.x>=s.x&&e.y>=s.y&&e.x+e.w<=s.x+s.w&&e.y+e.h<=s.y+s.h);
    const b=e.fill?color(e.fill,d.theme):(under?'#ffffff':bgc);return ratio(fg,b)<3});
  out.push(low.length?['warn',`Poco contraste: "${low[0].name}"${low.length>1?` y ${low.length-1} más`:''}.`]:['ok','Los textos se leen bien sobre el fondo.']);

    $('#japply').onclick=()=>{try{const nd=JSON.parse($('#jta').value);if(!Array.isArray(nd.els)||!nd.theme||!nd.bg)throw 0;snapshot();if(S.scope==='event')S.designs.event=nd;else S.designs.types[S.scope]=nd;commit();toast('Diseño aplicado')}catch(e){toast('El texto no es un diseño válido')}};

function bindCanvas(ov,sc,d){
  ov.querySelectorAll('.hit').forEach(n=>n.addEventListener('pointerdown',ev=>{
    ev.preventDefault();const el=d.els.find(e=>e.id===n.dataset.id);S.sel=el.id;S.pt='el';
    renderLayers();renderProps();ov.querySelectorAll('.hit').forEach(h=>h.classList.toggle('sel',h.dataset.id===el.id));
    if(el.locked)return;snapshot();startDrag(ev,el,sc,'move',d);
  }));
  ov.querySelectorAll('.hnd').forEach(h=>h.addEventListener('pointerdown',ev=>{ev.preventDefault();ev.stopPropagation();const el=selEl();if(!el)return;snapshot();startDrag(ev,el,sc,h.dataset.h,d)}));
}
function minSize(e){if(e.kind==='code')return CODE_MIN[e.mode||'qr'];return [14,e.kind==='shape'&&e.sh==='dash'?0:14]}
function startDrag(ev,el,sc,mode,d){
  const {w:W,h:H}=dim(d),x0=ev.clientX,y0=ev.clientY,o={x:el.x,y:el.y,w:el.w,h:el.h},sq=el.kind==='code'&&(el.mode||'qr')==='qr',dash=el.kind==='shape'&&el.sh==='dash';
  const grid=v=>S.snap?Math.round(v/10)*10:v;
  const move=e=>{
    const dx=(e.clientX-x0)/sc,dy=(e.clientY-y0)/sc;guides=[];
    if(mode==='move'){
      let nx=grid(o.x+dx),ny=grid(o.y+dy);const cx=nx+el.w/2,cy=ny+el.h/2,T=5;
      if(Math.abs(cx-W/2)<T){nx=W/2-el.w/2;guides.push({v:true,p:W/2})}
      if(Math.abs(nx)<T){nx=0;guides.push({v:true,p:0})}
      if(Math.abs(nx+el.w-W)<T){nx=W-el.w;guides.push({v:true,p:W})}
      if(Math.abs(cy-H/2)<T){ny=H/2-el.h/2;guides.push({v:false,p:H/2})}
      if(el.kind==='code'){nx=Math.min(Math.max(nx,0),W-el.w);ny=Math.min(Math.max(ny,0),H-el.h)}
      el.x=Math.round(nx);el.y=Math.round(ny);
    }else{
      let nx=o.x,ny=o.y,nw=o.w,nh=o.h;
      if(mode.includes('e'))nw=o.w+dx;if(mode.includes('s'))nh=o.h+dy;
      if(mode.includes('w')){nw=o.w-dx;nx=o.x+dx}if(mode.includes('n')){nh=o.h-dy;ny=o.y+dy}
      if(sq){const s=Math.max(nw,nh);nw=nh=s;if(mode.includes('w'))nx=o.x+o.w-s;if(mode.includes('n'))ny=o.y+o.h-s}
      const [mw,mh]=minSize(el);
      if(nw<mw){if(mode.includes('w'))nx=o.x+o.w-mw;nw=mw}
      if(!dash&&nh<mh){if(mode.includes('n'))ny=o.y+o.h-mh;nh=mh}
      if(el.kind==='code'){nx=Math.max(0,nx);ny=Math.max(0,ny);nw=Math.min(nw,W-nx);nh=Math.min(nh,H-ny)}
      el.x=Math.round(nx);el.y=Math.round(ny);el.w=Math.round(nw);el.h=dash?0:Math.round(nh);
    }
    persist();renderView();renderProps(true);
  };
  const up=()=>{removeEventListener('pointermove',move);removeEventListener('pointerup',up);guides=[];renderView();renderProps()};
  addEventListener('pointermove',move);addEventListener('pointerup',up);
}

  $('#layers').querySelectorAll('.layer').forEach(n=>n.onclick=ev=>{if(ev.target.closest('[data-eye]'))return;S.sel=n.dataset.id;S.pt='el';commit()});

  <div class="sec"><div class="st">Capa</div>
    ${!isCode?R('Bloquear',`<input type="checkbox" data-p="locked" ${e.locked?'checked':''}>`):''}
    <div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn sm" id="fwd">Traer adelante</button><button class="btn sm" id="bwd">Enviar atrás</button>${!e.prot?`<button class="btn sm" id="dup">Duplicar</button><button class="btn sm" id="del" style="color:var(--red)">Eliminar</button>`:''}</div>
    ${isCode?'<div class="hint">El código de acceso es obligatorio: no se puede borrar ni ocultar.</div>':''}</div>`;
  box.querySelectorAll('[data-p]').forEach(x=>{
    const k=x.dataset.p;
    const apply=()=>{let v=x.type==='checkbox'?x.checked:(x.type==='range'||x.type==='number')?+x.value:x.value;
      if(k==='opacity')v=v/100;
      if(isCode&&k==='w'){v=Math.max(CODE_MIN[mode][0],v);if(mode==='qr')e.h=v}
      if(isCode&&k==='h')v=Math.max(CODE_MIN[mode][1],v);
      e[k]=v;persist();renderView();renderLayers();const o=x.parentElement.querySelector('output');if(o)o.textContent=k==='opacity'?x.value+'%':x.value+(['rot','ang'].includes(k)?'°':'')};
    x.addEventListener('input',apply);x.addEventListener('change',()=>{snapshot();apply();if(['SELECT'].includes(x.tagName)||x.type==='checkbox')renderProps()});
  });
  box.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{snapshot();const m=b.dataset.mode;e.mode=m;const cx=e.x+e.w/2;
    const SZ={qr:[200,200],bar:[280,90],both:[240,300],nfc:[200,200]}[m];e.w=SZ[0];e.h=SZ[1];e.x=Math.round(Math.min(Math.max(0,cx-e.w/2),W-e.w));e.y=Math.min(e.y,H-e.h);commit()});
  box.querySelectorAll('[data-al]').forEach(b=>b.onclick=()=>{snapshot();e.align=b.dataset.al;commit()});
  box.querySelectorAll('[data-sw]').forEach(b=>b.onclick=()=>{snapshot();e[b.dataset.sw]=b.dataset.v||null;commit()});
  box.querySelectorAll('[data-col]').forEach(i=>i.onchange=()=>{snapshot();e[i.dataset.col]=i.value;commit()});
  box.querySelectorAll('[data-aln]').forEach(b=>b.onclick=()=>{snapshot();const k=b.dataset.aln;if(k==='l')e.x=0;if(k==='c')e.x=Math.round((W-e.w)/2);if(k==='r')e.x=W-e.w;if(k==='t')e.y=0;if(k==='m')e.y=Math.round((H-e.h)/2);if(k==='b')e.y=H-e.h;commit()});
  const i=d.els.indexOf(e);
  $('#fwd').onclick=()=>{if(i<d.els.length-1){snapshot();[d.els[i],d.els[i+1]]=[d.els[i+1],d.els[i]];commit()}};
  $('#bwd').onclick=()=>{if(i>0){snapshot();[d.els[i],d.els[i-1]]=[d.els[i-1],d.els[i]];commit()}};
  const du=$('#dup');if(du)du.onclick=duplicate;const de=$('#del');if(de)de.onclick=remove;
}
function duplicate(){const d=editing(),e=selEl();if(!d||!e||e.prot)return;snapshot();const c=clone(e);c.id=nid();c.x+=12;c.y+=12;c.locked=false;c.name=e.name+' (copia)';d.els.push(c);S.sel=c.id;commit()}
function remove(){const d=editing(),e=selEl();if(!d||!e||e.prot||e.locked)return;snapshot();d.els=d.els.filter(x=>x.id!==e.id);S.sel=null;commit()}
function pickImage(cb){const f=$('#file');f.accept='image/*';f.value='';f.onchange=()=>{const file=f.files[0];if(!file)return;if(file.size>5*1024*1024){toast('La imagen pesa más de 5 MB');return}const r=new FileReader();r.onload=()=>cb(r.result);r.readAsDataURL(file)};f.click()}

/* ═════════ Acciones ═════════ */
document.querySelectorAll('[data-add]').forEach(b=>b.onclick=()=>{
  const d=editing();if(!d){toast('Primero personaliza este tipo de entrada');return}
  const k=b.dataset.add,base={id:nid(),x:40,y:300,visible:true},add=e=>{snapshot();d.els.push(e);S.sel=e.id;S.pt='el';commit()};
  if(k==='text')add({...base,kind:'text',name:'Texto nuevo',text:'Escribe aquí',w:200,h:30,size:18,weight:700,font:'Poppins',color:'@text',align:'left'});
  if(k==='field')add({...base,kind:'field',name:'Dato nuevo',field:'org.name',w:200,h:28,size:16,weight:600,font:'Poppins',color:'@text',align:'left'});
  if(k==='shape')add({...base,kind:'shape',sh:'rect',name:'Forma nueva',w:120,h:60,fill:'@primary',radius:14});
  if(k==='circle')add({...base,kind:'shape',sh:'circle',name:'Círculo',w:80,h:80,fill:'@secondary'});
  if(k==='dash')add({...base,kind:'shape',sh:'dash',name:'Línea de corte',w:312,h:0,x:24,bc:'@text',opacity:.6});
  if(k==='image')pickImage(src=>add({...base,kind:'image',name:'Imagen',src,w:120,h:120,radius:12}));
});
$('#undo').onclick=()=>{if(!past.length)return;future.push(JSON.stringify(S.designs));S.designs=JSON.parse(past.pop());commit()};
$('#redo').onclick=()=>{if(!future.length)return;past.push(JSON.stringify(S.designs));S.designs=JSON.parse(future.pop());commit()};
document.querySelectorAll('.ptabs button').forEach(b=>b.onclick=()=>{S.pt=b.dataset.pt;renderProps()});
$('#reset').onclick=()=>openModal(`<h3>Restablecer el diseño</h3><p style="color:var(--muted);line-height:1.6">Vuelve al diseño original de iPass y quita los diseños propios de cada tipo. El historial de versiones se conserva.</p><div style="display:flex;gap:8px;justify-content:flex-end;margin-top:16px"><button class="btn" onclick="closeModal()">Cancelar</button><button class="btn pri" id="ok">Restablecer</button></div>`,()=>{$('#ok').onclick=()=>{snapshot();S.designs={event:defaultDesign('ipass'),types:{gen:null,ter:null,vip:null}};S.scope='event';S.sel=null;closeModal();commit();toast('Diseño restablecido')}});
$('#publish').onclick=()=>{
  const all=[S.designs.event,...Object.values(S.designs.types).filter(Boolean)];
  if(all.some(d=>review(d).some(r=>r[0]==='bad'))){openModal(`<h3>No se puede publicar</h3><p style="color:var(--muted);line-height:1.6">Hay un problema con el código de acceso (tamaño, algo encima o fuera de la entrada). Corrígelo: una entrada que no se lee no entra.</p><div style="text-align:right;margin-top:16px"><button class="btn pri" onclick="closeModal()">Entendido</button></div>`);return}
  S.versions.unshift({ts:new Date().toLocaleString('es-BO'),snap:JSON.stringify(S.designs)});persist();toast(`Publicado (versión ${S.versions.length}) · se aplica a las 3 noches`);
};
$('#hist').onclick=()=>openModal(`<h3>Historial de versiones</h3>${S.versions.length?S.versions.map((v,i)=>`<div class="ver"><span>Versión ${S.versions.length-i} · ${v.ts}</span><button class="btn sm" data-rs="${i}">Restaurar</button></div>`).join(''):'<p style="color:var(--muted)">Todavía no publicaste ninguna versión.</p>'}<div style="text-align:right;margin-top:14px"><button class="btn" onclick="closeModal()">Cerrar</button></div>`,()=>{document.querySelectorAll('[data-rs]').forEach(b=>b.onclick=()=>{snapshot();S.designs=JSON.parse(S.versions[+b.dataset.rs].snap);closeModal();commit();toast('Versión restaurada (sin publicar)')})});
$('#test').onclick=()=>{
  const d=shownDesign(),r=review(d),bad=r.filter(x=>x[0]==='bad');
  openModal(`<h3>Prueba de lectura del código</h3><div class="checks" style="margin:0 0 14px">${r.map(([k,t])=>`<div class="chk ${k}"><b>${k==='ok'?'✓':k==='warn'?'!':'✕'}</b><span>${t}</span></div>`).join('')}</div><p style="font-size:14px;font-weight:700;color:${bad.length?'var(--red)':'var(--green)'}">${bad.length?'✕ Este diseño puede no leerse en la puerta.':'✓ El código se leería sin problema.'}</p><p class="hint" style="margin-top:8px">En el sistema real esta prueba dibuja el código y lo lee con un lector, igual que la cámara de la puerta.</p><div style="text-align:right;margin-top:14px"><button class="btn pri" onclick="closeModal()">Cerrar</button></div>`);
};
function openModal(html,after){$('#box').innerHTML=html;$('#modal').classList.add('open');if(after)after()}
function closeModal(){$('#modal').classList.remove('open')}
$('#modal').onclick=e=>{if(e.target.id==='modal')closeModal()};
addEventListener('keydown',e=>{
  if(e.target.matches('input,select,textarea'))return;
  const el=selEl();
  if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='z'){e.preventDefault();$('#undo').click();return}
  if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='y'){e.preventDefault();$('#redo').click();return}
  if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='d'){e.preventDefault();duplicate();return}
  if((e.key==='Delete'||e.key==='Backspace')&&el){e.preventDefault();remove();return}
  if(el&&!el.locked&&e.key.startsWith('Arrow')){e.preventDefault();snapshot();const s=e.shiftKey?10:1;
    if(e.key==='ArrowLeft')el.x-=s;if(e.key==='ArrowRight')el.x+=s;if(e.key==='ArrowUp')el.y-=s;if(e.key==='ArrowDown')el.y+=s;commit()}
});
addEventListener('resize',()=>renderView());
function renderAll(){renderScope();renderTabs();renderLayers();renderProps();renderView();$('#undo').disabled=!past.length;$('#redo').disabled=!future.length}
renderAll();
</script>
</body>
</html>
